name: Foundation checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config curl wget file libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-pipewire gstreamer1.0-plugins-base
      - name: Toolchains and locked install
        run: |
          npm install --global pnpm@12.18.0
          rustup show
          pnpm install --frozen-lockfile
      - name: Secret and dependency audits
        shell: bash
        run: |
          set -euo pipefail
          audit_dir=$(mktemp -d)
          pushd "$audit_dir"
          curl --fail --silent --show-error --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --output cargo-audit.tgz https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-gnu-v0.23.0.tgz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks.tar.gz b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59 cargo-audit.tgz | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          tar -xzf cargo-audit.tgz cargo-audit-x86_64-unknown-linux-gnu-v0.23.0/cargo-audit
          popd
          "$audit_dir/gitleaks" git --redact --no-banner .
          "$audit_dir/cargo-audit-x86_64-unknown-linux-gnu-v0.23.0/cargo-audit" audit --file src-tauri/Cargo.lock
          pnpm audit
      - name: Frontend checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Locked desktop bundle
        run: |
          pnpm exec tauri build --bundles deb -- --locked
          git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
